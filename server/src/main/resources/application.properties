spring.application.name=demo
spring.main.banner-mode=off
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%level) %clr(%-40.40logger{39}){cyan} %clr(:){faint} %clr(%msg){yellow}%n%wEx
spring.config.import=classpath:database.properties
# Reject decimal JSON numbers for integral fields instead of truncating ratings or identifiers.
spring.jackson.deserialization.accept-float-as-int=false
